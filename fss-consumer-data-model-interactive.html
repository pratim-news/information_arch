    { a: 'support', b: 'entitlement', card: '*-*' },
    { a: 'payment', b: 'generalLedger', card: '*-1', core: true },
  ];

  function loadErdLayout() {
    try {
      const raw = localStorage.getItem(ERD_LAYOUT_KEY);
      if (!raw) return { ...Object.fromEntries(Object.entries(ERD_LAYOUT_DEFAULT).map(([k, v]) => [k, { ...v }])) };
      const parsed = JSON.parse(raw);
      const out = {};
      Object.keys(ERD_LAYOUT_DEFAULT).forEach((id) => {
        const p = parsed[id];
        out[id] = p && Number.isFinite(p.x) && Number.isFinite(p.y)
          ? { x: p.x, y: p.y }
          : { ...ERD_LAYOUT_DEFAULT[id] };
      });
      return out;
    } catch (e) {
      return { ...Object.fromEntries(Object.entries(ERD_LAYOUT_DEFAULT).map(([k, v]) => [k, { ...v }])) };
    }
  }

  function saveErdLayout() {
    try { localStorage.setItem(ERD_LAYOUT_KEY, JSON.stringify(ERD_LAYOUT)); } catch (e) { /* ignore */ }
  }

  function resetErdLayout() {
    ERD_LAYOUT = { ...Object.fromEntries(Object.entries(ERD_LAYOUT_DEFAULT).map(([k, v]) => [k, { ...v }])) };
    try { localStorage.removeItem(ERD_LAYOUT_KEY); } catch (e) { /* ignore */ }
  }

  /** Keep entity.links in sync with ERD_RELS for detail-panel navigation. */
  (function syncErdLinksFromRels() {
    Object.keys(DATA_MODEL_2.entities).forEach((id) => {
      DATA_MODEL_2.entities[id].links = [];
    });
    ERD_RELS.forEach((r) => {
      if (!DATA_MODEL_2.entities[r.a] || !DATA_MODEL_2.entities[r.b]) return;
      if (!DATA_MODEL_2.entities[r.a].links.includes(r.b)) DATA_MODEL_2.entities[r.a].links.push(r.b);
      if (!DATA_MODEL_2.entities[r.b].links.includes(r.a)) DATA_MODEL_2.entities[r.b].links.push(r.a);
    });
  })();

  let erdArrangeMode = false;
  let erdShotMode = false;
  let erdShowAllRels = false;
  let erdShowCardLabels = true;

  let currentLayer = 'valuechain';
  let selection = null;

  // Client-side gate only - obscures Admin controls; not strong security.
  // Change ADMIN_PASSWORD to whatever the curator wants.
  const ADMIN_PASSWORD = '1234';
  const ADMIN_UNLOCK_KEY = 'fss-ia-admin-unlocked';

  function isAdminUnlocked() {
    try { return sessionStorage.getItem(ADMIN_UNLOCK_KEY) === '1'; } catch (e) { return false; }
  }
  function setAdminUnlocked(on) {
    try {
      if (on) sessionStorage.setItem(ADMIN_UNLOCK_KEY, '1');
      else sessionStorage.removeItem(ADMIN_UNLOCK_KEY);
    } catch (e) { /* ignore */ }
  }

  function syncAdminNavVisibility() {
    const nav = document.querySelector('.nav');
    if (!nav) return;
    const open = isAdminUnlocked();
    nav.classList.toggle('admin-open', open);
    // If admin locks while on Migration, leave that layer.
    if (!open && currentLayer === 'migration') {
      currentLayer = 'datamaster';
      document.querySelectorAll('.nav button').forEach((b) => b.classList.toggle('active', b.dataset.layer === currentLayer));
    }
  }

  function bindAdminFooter(L) {
    const unlocked = isAdminUnlocked();
    const gate = document.getElementById('admin-gate');
    const tools = document.getElementById('admin-tools');
    if (!gate || !tools) return;

    syncAdminNavVisibility();
    gate.hidden = unlocked;
    tools.hidden = !unlocked;

    if (!unlocked) {
      const form = document.getElementById('admin-pass-form');
      const err = document.getElementById('admin-pass-err');
      document.getElementById('admin-unlock-btn')?.addEventListener('click', () => {
        if (form) form.hidden = false;
        document.getElementById('admin-pass-input')?.focus();
      });
      form?.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const val = (document.getElementById('admin-pass-input')?.value || '').trim();
        if (val === ADMIN_PASSWORD) {
          setAdminUnlocked(true);
          if (err) err.hidden = true;
          syncAdminNavVisibility();
          bindAdminFooter(L);
          mountAdminTools(L);
        } else {
          if (err) err.hidden = false;
        }
      });
      return;
    }

    mountAdminTools(L);
    document.getElementById('admin-lock-btn')?.addEventListener('click', () => {
      setAdminUnlocked(false);
      syncAdminNavVisibility();
      renderLayer();
    });
  }

  function mountAdminTools(L) {
    const showRef = document.getElementById('show-ref');
    const refImgs = document.querySelectorAll('.ref-img');
    if (showRef && refImgs.length) {
      showRef.addEventListener('change', function () {
        refImgs.forEach((img) => img.classList.toggle('show', this.checked));
      });
    }
    document.getElementById('admin-open-migration')?.addEventListener('click', () => {
      switchLayer('migration');
    });
    if (currentLayer === 'valuechain') {
      const slot = document.getElementById('vc-editor-slot');
      if (slot && typeof FSS_VC !== 'undefined') {
        vcEditorApi = FSS_VC.mountEditor(slot, {
          getData: () => vcDocument,
          setData: (d) => { vcDocument = d; },
          onApply: (d) => {
            applyValueChainDocument(d);
            renderLayer();
          },
          onStatus: () => updateVcStatus(),
        });
        updateVcStatus();
      } else if (slot) {
        slot.innerHTML = '';
      }
    }
  }

  const main = document.getElementById('main');
  const detailEmpty = document.getElementById('detail-empty');
  const detailBody = document.getElementById('detail-body');
  const detailPanel = document.getElementById('detail');

  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function sorClass(val) {
    if (!val || val === '-' || val === 'X') return 'x';
    const v = String(val).toLowerCase();
    if (v.includes('sor') || v === '*') return v === '*' ? 'mc' : 'sor';
    if (v.includes('ref')) return 'ref';
    if (v.includes('mc') || v.includes('link')) return 'mc';
    return '';
  }

  function normalizeStages(list) {
    return (list || []).map((s) => {
      const valueChain = s.valueChain || s.journey || s.value_chain || '';
      return { id: s.id, label: s.label, valueChain, journey: valueChain };
    });
  }

  function stageCol(stageId) {
    return STAGES.findIndex(s => s.id === stageId) + 2;
  }

  function objHtml(obj) {
    if (!obj) return '';
    const parts = String(obj).split(/,\s*/).map((p) => p.trim()).filter(Boolean);
    if (!parts.length) return '';
    if (parts.length === 1) return `<div class="obj">${esc(parts[0])}</div>`;
    return `<div class="objs">${parts.map((p) => `<div class="obj">${esc(p)}</div>`).join('')}</div>`;
  }

  // Entity ids referenced by a compiled VC cell (single or multi-block).
  function cellEntityIds(c) {
    if (!c) return [];
    if (Array.isArray(c.multi) && c.multi.length) {
      return c.multi.map((b) => b.e).filter(Boolean);
    }
    return c.e ? [c.e] : [];
  }

  function cellHtml(c, row, stageId) {
    if (!c) return '';
    if (c.multi) {
      return c.multi.map((b) =>
        `<div class="vc-block" data-e="${esc(b.e || '')}"><div class="cap">${esc(b.cap)}</div>${objHtml(b.obj)}</div>`
      ).join('');
    }
    return `<div class="cap">${esc(c.cap)}</div>${objHtml(c.obj)}`;
  }

  function renderValueChain() {
    // Prefer live document stages so Value Chain labels never drop during compile/field renames
    const stages = normalizeStages((vcDocument && vcDocument.stages && vcDocument.stages.length) ? vcDocument.stages : STAGES);
    if (stages.length) STAGES = stages;

    let html = '<div class="panel">';
    html += `<div class="toolbar"><button type="button" id="vc-clear">Clear selection</button></div>`;
    html += `<div class="vc-key">
      <span class="vc-key-title">Key</span>
      <div class="vc-key-sample">
        <div class="cap">Capability</div>
        <div class="obj">Business Object</div>
      </div>
      <div class="vc-key-labels">
        <div><strong>Journey</strong> - deep blue column headers (Attract to Leave)</div>
        <div><strong>Value Chain</strong> - light blue row under Journey</div>
        <div><strong>Function</strong> - left-hand rows (Shopfront, Self Care, ...)</div>
      </div>
    </div>`;
    html += `<div class="vc-grid" style="grid-template-rows: auto auto repeat(${VC_ROWS.length}, auto)">`;
    html += '<div class="corner" style="grid-row:1;grid-column:1">Journey</div>';
    stages.forEach((s, i) => {
      html += `<div class="journey-hdr" style="grid-row:1;grid-column:${i + 2}">${esc(s.label)}</div>`;
    });
    html += '<div class="corner corner-vc" style="grid-row:2;grid-column:1">Function</div>';
    stages.forEach((s, i) => {
      html += `<div class="vc-hdr" style="grid-row:2;grid-column:${i + 2}">${esc(s.valueChain || '')}</div>`;
    });
    VC_ROWS.forEach((row, ri) => {
      const gridRow = ri + 3;
      html += `<div class="func-hdr" style="grid-row:${gridRow};grid-column:1">${esc(row.label)}<small>${esc(row.sub)}</small></div>`;
      const rs = rowStages(row) || {};
      const spans = (row.spans && row.spans.length)
        ? row.spans
        : (row.spanStages && row.spanStages.length ? [{ spanStages: row.spanStages, cell: row.cell }] : []);
      const covered = new Set();
      spans.forEach((sp) => (sp.spanStages || []).forEach((id) => covered.add(id)));
      stages.forEach(st => {
        const startSpan = spans.find((sp) => sp.spanStages && sp.spanStages[0] === st.id);
        if (startSpan) {
          const c = startSpan.cell || {};
          const ents = cellEntityIds(c);
          const start = stageCol(startSpan.spanStages[0]);
          const end = stageCol(startSpan.spanStages[startSpan.spanStages.length - 1]) + 1;
          const spanCls = (startSpan.spanStages.length > 1) ? ' vc-span' : '';
          html += `<div class="vc-cell${spanCls}" style="grid-row:${gridRow};grid-column:${start}/${end}" data-e="${esc(ents[0] || '')}" data-entities="${esc(ents.join(','))}" data-stage="${esc(st.id)}" data-func="${esc(row.id)}">${cellHtml(c, row)}</div>`;
          return;
        }
        if (covered.has(st.id)) return;
        const c = rs[st.id];
        const col = stageCol(st.id);
        if (!c) html += `<div class="vc-cell empty" style="grid-row:${gridRow};grid-column:${col}"></div>`;
        else {
          const ents = cellEntityIds(c);
          html += `<div class="vc-cell" style="grid-row:${gridRow};grid-column:${col}" data-e="${esc(ents[0] || '')}" data-entities="${esc(ents.join(','))}" data-stage="${st.id}" data-func="${esc(row.id)}">${cellHtml(c, row, st.id)}</div>`;
        }
      });
    });
    html += '</div></div>';
    return html;
  }

  function relatedIds(entityId) {
    if (!entityId) return [];
    const e = ENTITIES[entityId];
    const out = new Set([entityId]);
    if (e && Array.isArray(e.ids)) e.ids.forEach((id) => out.add(id));
    if (e && Array.isArray(e.also)) e.also.forEach((id) => out.add(id));
    return [...out];
  }

  // True when two entity keys share any related-id (e.g. product <-> promotion/offer).
  function entitiesRelated(a, b) {
    if (!a || !b) return false;
    if (a === b) return true;
    const left = new Set(relatedIds(a));
    return relatedIds(b).some((id) => left.has(id));
  }

  // Parse data-entities / data-e from a rendered VC cell.
  function vcCellEntityList(el) {
    const raw = (el && (el.dataset.entities || el.dataset.e)) || '';
    return raw.split(',').map((s) => s.trim()).filter(Boolean);
  }

  function vcCellMatchesEntity(el, entityId) {
    if (!entityId || !el) return false;
    return vcCellEntityList(el).some((eid) => entitiesRelated(entityId, eid));
  }

  // ---- Cross-layer link index (value chain <-> capability <-> ERD) ----
  // Reverse map: ENTITIES key -> ERD node id (via mapTo). First match wins.
  const ERD_BY_MAPTO = {};
  Object.entries(DATA_MODEL_2.entities).forEach(([id, e]) => {
    const key = e.mapTo || id;
    if (!(key in ERD_BY_MAPTO)) ERD_BY_MAPTO[key] = id;
  });

  // Resolve an ERD node for an ENTITIES key: try the key directly, then its related ids.
  function erdIdForEntity(entityId) {
    if (!entityId) return null;
    if (ERD_BY_MAPTO[entityId]) return ERD_BY_MAPTO[entityId];
    for (const id of relatedIds(entityId)) if (ERD_BY_MAPTO[id]) return ERD_BY_MAPTO[id];
    return null;
  }

  // Find the capability group an entity belongs to (exact membership first, then related ids).
  function capGroupForEntity(entityId) {
    if (!entityId) return null;
    const exact = CAPABILITY_GROUPS.find((g) => g.entities.includes(entityId));
    if (exact) return exact;
    const rel = new Set(relatedIds(entityId));
    return CAPABILITY_GROUPS.find((g) => g.entities.some((e) => rel.has(e))) || null;
  }

  // Platform overlay group for an entity (same membership rules as capability).
  function platformGroupForEntity(entityId) {
    if (!entityId) return null;
    const exact = PLATFORM_GROUPS.find((g) => g.entities.includes(entityId));
    if (exact) return exact;
    const rel = new Set(relatedIds(entityId));
    return PLATFORM_GROUPS.find((g) => g.entities.some((e) => rel.has(e))) || null;
  }

  // SoR / MC matrix rows that reference this entity (or a related id).
  function sorHitsForEntity(entityId) {
    if (!entityId) return [];
    const hits = [];
    const scan = (section, data) => {
      Object.values(data).forEach((row) => {
        if (entitiesRelated(entityId, row.entity)) hits.push({ section, label: row.label, entity: row.entity });
      });
    };
    scan('Registration', SOR_REG);
    scan('Subscription', SOR_SUB);
    return hits;
  }

  // Migration journey rows that reference this entity (or a related id).
  function migHitsForEntity(entityId) {
    if (!entityId) return [];
    return MIG_ROWS.filter((row) => entitiesRelated(entityId, row.entity))
      .map((row) => ({ label: row.label, entity: row.entity }));
  }

  // Value-chain stages (labels) where an entity (or its related ids) appears in a cell.
  function vcStageLabelsForEntity(entityId) {
    if (!entityId) return [];
    const stageIds = new Set();
    const matches = (c) => cellEntityIds(c).some((x) => entitiesRelated(entityId, x));
    VC_ROWS.forEach((row) => {
      const spans = (row.spans && row.spans.length)
        ? row.spans
        : (row.spanStages && row.spanStages.length ? [{ spanStages: row.spanStages, cell: row.cell }] : []);
      spans.forEach((sp) => {
        if (matches(sp.cell)) (sp.spanStages || []).forEach((id) => stageIds.add(id));
      });
      const rs = rowStages(row) || {};
      Object.keys(rs).forEach((sid) => { if (matches(rs[sid])) stageIds.add(sid); });
    });
    return STAGES.filter((s) => stageIds.has(s.id)).map((s) => s.label);
  }

  // Element to scroll into view after a cross-layer jump (set by crossJump, consumed after render).
  let pendingFocus = null;
  function focusPending() {
    if (!pendingFocus) return;
    let el = null;
    if (pendingFocus.erdId) el = main.querySelector(`.erd-node[data-erd="${pendingFocus.erdId}"]`);
    else if (pendingFocus.group) el = main.querySelector(`.cap-group[data-group="${pendingFocus.group}"]`);
    else if (pendingFocus.vc) el = main.querySelector('.vc-cell.sel:not(.empty)');
    else if (pendingFocus.matrix) el = main.querySelector('.sor-cell.sel, .entity-col.sel, .sel');
    if (!el) el = main.querySelector('.erd-node.sel, .cap-group.sel, .vc-cell.sel, .sel');
    pendingFocus = null;
    if (el && typeof el.scrollIntoView === 'function') {
      el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    }
  }

  // Jump to another layer while keeping the current selection; resolve ERD node and focus target.
  // Re-renders the detail panel on the destination so back-links (e.g. from Data Model 2.0
  // back to value chain / capability) appear for the new layer.
  function crossJump(layerId, opts) {
    opts = opts || {};
    const keep = selection ? Object.assign({}, selection) : null;
    if (keep) {
      if (opts.erdId) keep.erdId = opts.erdId;
      else if (layerId === 'datamodel2' && !keep.erdId && keep.entityId) {
        const erdId = erdIdForEntity(keep.entityId);
        if (erdId) keep.erdId = erdId;
      }
    }
    let focusGroup = null;
    if (layerId === 'capability') {
      focusGroup = opts.group || (keep && capGroupForEntity(keep.entityId) && capGroupForEntity(keep.entityId).id);
    } else if (layerId === 'platform') {
      focusGroup = opts.group || (keep && platformGroupForEntity(keep.entityId) && platformGroupForEntity(keep.entityId).id);
    }
    pendingFocus = {
      erdId: layerId === 'datamodel2' ? (keep && keep.erdId) : null,
      group: focusGroup,
      vc: layerId === 'valuechain',
      matrix: layerId === 'datamaster' || layerId === 'migration',
    };
    switchLayer(layerId);
    if (keep) {
      if (layerId === 'datamodel2' && keep.erdId) {
        const node = DATA_MODEL_2.entities[keep.erdId];
        showDetail({
          type: 'erd',
          erdId: keep.erdId,
          entityId: keep.entityId || (node && node.mapTo) || keep.erdId,
          title: (node && node.name) || keep.title,
        });
      } else {
        showDetail(keep);
      }
    }
    focusPending();
  }

  // Build the "Appears across layers" trail HTML for the current selection / layer.
  function trailHtml(payload, erd) {
    const trailEntity = payload.entityId || (erd && erd.mapTo) || null;
    if (!trailEntity) return '';
    const links = [];
    const vcLabels = vcStageLabelsForEntity(trailEntity);
    if (vcLabels.length && currentLayer !== 'valuechain') {
      links.push(`<button type="button" class="trail-link" data-jump="valuechain">Value chain &middot; ${esc(vcLabels.slice(0, 4).join(', '))}${vcLabels.length > 4 ? '&hellip;' : ''}</button>`);
    }
    const grp = capGroupForEntity(trailEntity);
    if (grp && currentLayer !== 'capability') {
      links.push(`<button type="button" class="trail-link" data-jump="capability" data-jump-group="${esc(grp.id)}">Capability &middot; ${esc(grp.title)}</button>`);
    }
    const erdTarget = payload.erdId || erdIdForEntity(trailEntity);
    if (erdTarget && currentLayer !== 'datamodel2') {
      const node = DATA_MODEL_2.entities[erdTarget];
      links.push(`<button type="button" class="trail-link" data-jump="datamodel2" data-jump-erd="${esc(erdTarget)}">Data Model 2.0 &middot; ${esc(node ? node.name : erdTarget)}</button>`);
    }
    const plat = platformGroupForEntity(trailEntity);
    if (plat && currentLayer !== 'platform') {
      links.push(`<button type="button" class="trail-link" data-jump="platform" data-jump-group="${esc(plat.id)}">Platform &middot; ${esc(plat.title)}</button>`);
    }
    const sorHits = sorHitsForEntity(trailEntity);
    if (sorHits.length && currentLayer !== 'datamaster') {
      const labels = sorHits.slice(0, 3).map((h) => h.label).join(', ');
      links.push(`<button type="button" class="trail-link" data-jump="datamaster">SoR / MC &middot; ${esc(labels)}${sorHits.length > 3 ? '&hellip;' : ''}</button>`);
    }
    const migHits = migHitsForEntity(trailEntity);
    if (migHits.length && currentLayer !== 'migration' && isAdminUnlocked()) {
      const labels = migHits.slice(0, 3).map((h) => h.label).join(', ');
      links.push(`<button type="button" class="trail-link" data-jump="migration">Migration &middot; ${esc(labels)}${migHits.length > 3 ? '&hellip;' : ''}</button>`);
    }
    if (!links.length) return '';
    return `<dl><dt>Appears across layers</dt><dd class="trail-links">${links.join('')}</dd></dl>`;
  }

  function renderStandaloneBar(mode) {
    const list = BRIDGE_BY_LAYER[mode] || STANDALONE_ENTITIES;
    if (!list || !list.length) return '';
    let html = '<div class="standalone-bar"><h4>Bridge entities (outside red outlines on slide)</h4>';
    list.forEach(eid => {
      const e = ENTITIES[eid];
      if (e) html += `<span class="entity-chip" data-e="${eid}">${esc(e.name)}</span>`;
    });
    return html + '</div>';
  }

  function renderCapGroups(mode) {
    const groups = mode === 'platform' ? PLATFORM_GROUPS : CAPABILITY_GROUPS;
    const cls = mode === 'platform' ? 'cap-group plat' : 'cap-group';
    let html = '<div class="cap-grid">';
    groups.forEach(g => {
      html += `<div class="${cls}" data-group="${esc(g.id)}" data-mode="${mode}"><h3>${esc(g.title)}</h3>`;
      g.entities.forEach(eid => {
        const e = ENTITIES[eid];
        if (e) html += `<span class="entity-chip" data-e="${eid}">${esc(e.name)}</span>`;
      });
      html += '</div>';
    });
    html += '</div>';
    html += renderStandaloneBar(mode);
    return html;
  }

  function renderSoRTable(section, data, cols) {
    let html = `<table class="sor-table"><thead><tr><th>Entity</th>`;
    cols.forEach(c => { html += `<th>${esc(SOR_LABELS[c])}</th>`; });
    html += '</tr></thead><tbody>';
    html += `<tr class="section-row"><td colspan="${cols.length + 1}">${esc(section)}</td></tr>`;
    Object.keys(data).forEach(key => {
      const row = data[key];
      html += `<tr><td class="entity-col" data-e="${esc(row.entity)}">${esc(row.label)}</td>`;
      cols.forEach(col => {
        const val = row.cells[col] || '-';
        html += `<td class="sor-cell ${sorClass(val)}" data-sor="${esc(val)}" data-e="${esc(row.entity)}" data-col="${col}" data-section="${esc(section)}">${esc(val)}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  const SOR_COLS_REG = ['sfcrm', 'auth0', 'zephr', 'zuora', 'ods', 'sfmcA', 'sfmce'];

  function renderDataMaster() {
    return `<div class="legend">
      <span><i style="background:#d4eddf"></i> SoR (System of Record)</span>
      <span><i style="background:#f5ecd4"></i> MC (Managed Copy)</span>
      <span><i style="background:#e8e8f0"></i> Ref</span>
      <span><i style="background:#f0f0f0"></i> X / N/A</span>
    </div>
    <div class="panel">${renderSoRTable('Registration', SOR_REG, SOR_COLS_REG)}<br/>${renderSoRTable('Subscription', SOR_SUB, SOR_COLS)}</div>`;
  }

  function renderMigration() {
    let html = `<div class="panel"><table class="sor-table"><thead><tr><th>Entity</th>`;
    MIG_COLS.forEach(c => { html += `<th>${esc(MIG_LABELS[c])}</th>`; });
    html += '</tr></thead><tbody>';
    MIG_ROWS.forEach(row => {
      html += `<tr><td class="entity-col" data-e="${esc(row.entity)}">${esc(row.label)}</td>`;
      MIG_COLS.forEach(col => {
        const val = (row.cells && row.cells[col]) || '-';
        html += `<td class="sor-cell" data-mig="${esc(val)}" data-e="${esc(row.entity)}" data-col="${col}">${esc(val)}</td>`;
      });
      html += '</tr>';
      if (row.cells && row.cells.note) {
        html += `<tr><td colspan="${MIG_COLS.length + 1}" style="text-align:left;font-size:11px;color:var(--warn)">Note: ${esc(row.cells.note)}</td></tr>`;
      }
    });
    html += '</tbody></table></div>';
    return html;
  }

  function clearSelection() {
    selection = null;
    detailEmpty.hidden = false;
    detailBody.hidden = true;
    detailBody.innerHTML = '';
    detailPanel.classList.remove('open');
    if (currentLayer === 'datamodel2') redrawErdEdges();
    else highlightSelection();
  }

  function erdCardParts(card) {
    const parts = String(card || '1-*').split('-');
    return { a: parts[0] === '*' ? '*' : '1', b: parts[1] === '*' ? '*' : '1' };
  }

  function erdRelsFor(id) {
    return ERD_RELS.filter((r) => r.a === id || r.b === id).map((r) => {
      const parts = erdCardParts(r.card);
      if (r.a === id) return { other: r.b, card: parts.a + '-' + parts.b, toward: parts.b };
      return { other: r.a, card: parts.b + '-' + parts.a, toward: parts.a };
    });
  }

  function erdRect(id) {
    const p = ERD_LAYOUT[id] || ERD_LAYOUT_DEFAULT[id];
    return { x: p.x, y: p.y, w: ERD_BOX.w, h: ERD_BOX.h };
  }

  function erdCentre(id) {
    const r = erdRect(id);
    return { x: r.x + r.w / 2, y: r.y + r.h / 2 };
  }

  /** Relationships drawn right now: core spine, plus everything on the selected entity. */
  function erdVisibleRels() {
    const focus = selection && selection.erdId ? selection.erdId : null;
    return ERD_RELS.filter((r) => {
      if (!ERD_LAYOUT[r.a] || !ERD_LAYOUT[r.b]) return false;
      if (erdShowAllRels || r.core) return true;
      return focus === r.a || focus === r.b;
    });
  }

  /** Which box side an edge should leave from, based on relative position. */
  function erdSideFor(fromId, toId) {
    const A = erdCentre(fromId);
    const B = erdCentre(toId);
    const dx = B.x - A.x;
    const dy = B.y - A.y;
    if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'r' : 'l';
    return dy >= 0 ? 'b' : 't';
  }

  /**
   * Spread every edge on a given side across that side, so hub entities fan out
   * instead of all lines converging on one point.
   */
  function erdPorts(rels) {
    const buckets = {};
    rels.forEach((r, i) => {
      const sideA = erdSideFor(r.a, r.b);
      const sideB = erdSideFor(r.b, r.a);
      (buckets[r.a + '|' + sideA] = buckets[r.a + '|' + sideA] || []).push({ i, id: r.a, other: r.b, side: sideA });
      (buckets[r.b + '|' + sideB] = buckets[r.b + '|' + sideB] || []).push({ i, id: r.b, other: r.a, side: sideB });
    });

    const ports = {};
    Object.keys(buckets).forEach((key) => {
      const list = buckets[key];
      const rect = erdRect(list[0].id);
      const horizontal = list[0].side === 't' || list[0].side === 'b';
      list.sort((p, q) => {
        const cp = erdCentre(p.other);
        const cq = erdCentre(q.other);
        return horizontal ? cp.x - cq.x : cp.y - cq.y;
      });
      list.forEach((p, k) => {
        const t = (k + 1) / (list.length + 1);
        let pt;
        let normal;
        if (p.side === 'l') { pt = { x: rect.x, y: rect.y + rect.h * t }; normal = { x: -1, y: 0 }; }
        else if (p.side === 'r') { pt = { x: rect.x + rect.w, y: rect.y + rect.h * t }; normal = { x: 1, y: 0 }; }
        else if (p.side === 't') { pt = { x: rect.x + rect.w * t, y: rect.y }; normal = { x: 0, y: -1 }; }
        else { pt = { x: rect.x + rect.w * t, y: rect.y + rect.h }; normal = { x: 0, y: 1 }; }
        ports[p.i + '|' + p.id] = { pt, normal, side: p.side };
      });
    });
    return ports;
  }

  function erdSegHitsRect(x1, y1, x2, y2, r, pad) {
    const rx1 = r.x - pad;
    const ry1 = r.y - pad;
    const rx2 = r.x + r.w + pad;
    const ry2 = r.y + r.h + pad;
    if (Math.abs(x1 - x2) < 0.5) {
      if (x1 <= rx1 || x1 >= rx2) return false;
      return Math.max(y1, y2) > ry1 && Math.min(y1, y2) < ry2;
    }
    if (y1 <= ry1 || y1 >= ry2) return false;
    return Math.max(x1, x2) > rx1 && Math.min(x1, x2) < rx2;
  }

  /** Gutter centre lines between box columns / rows, used as routing channels. */
  function erdChannels() {
    const xs = [];
    const ys = [];
    Object.keys(ERD_LAYOUT_DEFAULT).forEach((id) => {
      const r = erdRect(id);
      xs.push([r.x, r.x + r.w]);
      ys.push([r.y, r.y + r.h]);
    });
    function gaps(ranges, limit) {
      const starts = ranges.map((p) => p[0]).sort((a, b) => a - b);
      const ends = ranges.map((p) => p[1]).sort((a, b) => a - b);
      const out = [];
      starts.forEach((s) => {
        const before = ends.filter((e) => e <= s);
        const prev = before.length ? before[before.length - 1] : 0;
        if (s - prev > 16) out.push((prev + s) / 2);
      });
      const last = ends[ends.length - 1];
      if (limit - last > 16) out.push((last + limit) / 2);
      return [...new Set(out.map((v) => Math.round(v)))];
    }
    return { xs: gaps(xs, ERD_CANVAS.w), ys: gaps(ys, ERD_CANVAS.h) };
  }

  function erdPathCost(pts, aId, bId, ids) {
    let cost = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i];
      const [x2, y2] = pts[i + 1];
      cost += Math.abs(x2 - x1) + Math.abs(y2 - y1);
      ids.forEach((id) => {
        if (id === aId || id === bId) return;
        if (erdSegHitsRect(x1, y1, x2, y2, erdRect(id), 5)) cost += 8000;
      });
    }
    return cost + (pts.length - 2) * 70;
  }

  function erdDedupe(pts) {
    const out = [];
    pts.forEach((p) => {
      const last = out[out.length - 1];
      if (!last || Math.abs(last[0] - p[0]) > 0.5 || Math.abs(last[1] - p[1]) > 0.5) out.push(p);
    });
    return out;
  }

  /** Pick the orthogonal route with fewest box crossings, then fewest bends / shortest. */
  function erdRoute(rel, portA, portB, channels, ids) {
    const stub = 22;
    const a = portA.pt;
    const b = portB.pt;
    const sa = [a.x + portA.normal.x * stub, a.y + portA.normal.y * stub];
    const sb = [b.x + portB.normal.x * stub, b.y + portB.normal.y * stub];

    const candidates = [];
    const midX = (sa[0] + sb[0]) / 2;
    const midY = (sa[1] + sb[1]) / 2;

    const xChannels = [midX, ...channels.xs];
    const yChannels = [midY, ...channels.ys];

    yChannels.forEach((y) => {
      candidates.push([[a.x, a.y], sa, [sa[0], y], [sb[0], y], sb, [b.x, b.y]]);
    });
    xChannels.forEach((x) => {
      candidates.push([[a.x, a.y], sa, [x, sa[1]], [x, sb[1]], sb, [b.x, b.y]]);
    });
    candidates.push([[a.x, a.y], sa, [sb[0], sa[1]], sb, [b.x, b.y]]);
    candidates.push([[a.x, a.y], sa, [sa[0], sb[1]], sb, [b.x, b.y]]);

    let best = null;
    let bestCost = Infinity;
    candidates.forEach((raw) => {
      const pts = erdDedupe(raw);
      let ok = true;
      for (let i = 0; i < pts.length - 1; i++) {
        if (Math.abs(pts[i][0] - pts[i + 1][0]) > 0.5 && Math.abs(pts[i][1] - pts[i + 1][1]) > 0.5) ok = false;
      }
      if (!ok) return;
      const cost = erdPathCost(pts, rel.a, rel.b, ids);
      if (cost < bestCost) {
        bestCost = cost;
        best = pts;
      }
    });
    return best || erdDedupe([[a.x, a.y], sa, sb, [b.x, b.y]]);
  }

  /** Crow's foot (many) or bar (one) at a port, opening toward the entity box. */
  function erdMarkerPath(kind, port) {
    const { pt, normal } = port;
    const nx = normal.x;
    const ny = normal.y;
    const px = -ny;
    const py = nx;
    if (kind === '*') {
      const tipX = pt.x + nx * 12;
      const tipY = pt.y + ny * 12;
      return `M ${tipX} ${tipY} L ${pt.x + px * 6} ${pt.y + py * 6}`
        + ` M ${tipX} ${tipY} L ${pt.x - px * 6} ${pt.y - py * 6}`
        + ` M ${tipX} ${tipY} L ${pt.x} ${pt.y}`;
    }
    const bx = pt.x + nx * 9;
    const by = pt.y + ny * 9;
    return `M ${bx + px * 6} ${by + py * 6} L ${bx - px * 6} ${by - py * 6}`;
  }

  function erdLongestSegmentMid(pts) {
    let best = { len: -1, x: pts[0][0], y: pts[0][1], horizontal: true };
    for (let i = 0; i < pts.length - 1; i++) {
      const dx = Math.abs(pts[i + 1][0] - pts[i][0]);
      const dy = Math.abs(pts[i + 1][1] - pts[i][1]);
      const len = dx + dy;
      if (len > best.len) {
        best = {
          len,
          x: (pts[i][0] + pts[i + 1][0]) / 2,
          y: (pts[i][1] + pts[i + 1][1]) / 2,
          horizontal: dx >= dy,
        };
      }
    }
    return best;
  }

  function renderErdEdgesSvg() {
    const rels = erdVisibleRels();
    const ports = erdPorts(rels);
    const channels = erdChannels();
    const ids = Object.keys(ERD_LAYOUT_DEFAULT);
    let edges = '';

    rels.forEach((r, i) => {
      const portA = ports[i + '|' + r.a];
      const portB = ports[i + '|' + r.b];
      if (!portA || !portB) return;
      const parts = erdCardParts(r.card);
      const pts = erdRoute(r, portA, portB, channels, ids);
      const d = pts.map((p, k) => `${k ? 'L' : 'M'} ${p[0]} ${p[1]}`).join(' ');
      const mid = erdLongestSegmentMid(pts);
      const secondary = r.core ? '' : ' secondary';
      edges += `<g class="erd-edge-g${secondary}" data-a="${esc(r.a)}" data-b="${esc(r.b)}" data-card="${esc(r.card)}">
        <path class="erd-edge" d="${d}" />
        <path class="erd-edge" d="${erdMarkerPath(parts.a, portA)}" />
        <path class="erd-edge" d="${erdMarkerPath(parts.b, portB)}" />
        ${erdShowCardLabels
          ? `<text class="erd-card-label" x="${mid.horizontal ? mid.x : mid.x + 2}" y="${mid.horizontal ? mid.y - 5 : mid.y}" text-anchor="middle">${esc(r.card)}</text>`
          : ''}
      </g>`;
    });
    return edges;
  }

  function redrawErdEdges() {
    const svg = document.getElementById('erd-edges');
    if (!svg) return;
    svg.innerHTML = renderErdEdgesSvg();
    updateErdCounts();
    highlightSelection();
  }

  function updateErdCounts() {
    const el = document.getElementById('erd-rel-count');
    if (!el) return;
    const shown = erdVisibleRels().length;
    el.textContent = shown === ERD_RELS.length
      ? ERD_RELS.length + ' relationships (all)'
      : shown + ' of ' + ERD_RELS.length + ' relationships shown';
  }

  /** SoR pill for ERD nodes; Split entities expand to role -> system lines. */
  function erdSorMarkup(appLink) {
    if (!appLink || appLink.status !== 'verified' || !appLink.sor) return '';
    const roles = Array.isArray(appLink.roles) ? appLink.roles : [];
    if (String(appLink.sor).toLowerCase() === 'split' && roles.length) {
      const title = appLink.note || roles.map((r) => r.role + ' -> ' + r.sor).join('; ');
      const parts = roles.map((r) => `<span class="sor-part">${esc(r.sor)}: ${esc(r.role)}</span>`).join('');
      return `<span class="sor split" title="${esc(title)}"><span class="sor-head">Split</span>${parts}</span>`;
    }
    return `<span class="sor" title="${esc(appLink.note || appLink.sor)}">${esc(appLink.sor)}</span>`;
  }

  function renderDataModel2() {
    let nodes = '';
    Object.keys(ERD_LAYOUT_DEFAULT).forEach((id) => {
      const e = DATA_MODEL_2.entities[id];
      if (!e) return;
      const pos = ERD_LAYOUT[id] || ERD_LAYOUT_DEFAULT[id];
      const mapTo = e.mapTo || id;
      const defClamp = e.appLink && String(e.appLink.sor).toLowerCase() === 'split' ? 2 : 3;
      nodes += `<button type="button" class="erd-node${erdArrangeMode ? ' arrange' : ''}" data-erd="${esc(id)}" data-e="${esc(mapTo)}" style="left:${pos.x}px;top:${pos.y}px;width:${ERD_BOX.w}px;min-height:${ERD_BOX.h}px">
        <div class="nm">${esc(e.name)}</div>
        <div class="df" style="-webkit-line-clamp:${defClamp}">${esc(e.def)}</div>
        ${erdSorMarkup(e.appLink)}
      </button>`;
    });

    const coreCount = ERD_RELS.filter((r) => r.core).length;
    return `<div class="erd-wrap">
      <div class="erd-chrome">
        <div class="erd-toolbar">
          <button type="button" id="erd-clear">Clear selection</button>
          <button type="button" id="erd-showall" class="${erdShowAllRels ? 'on' : ''}">Show all relationships</button>
          <button type="button" id="erd-labels" class="${erdShowCardLabels ? 'on' : ''}">Cardinality labels</button>
          <button type="button" id="erd-shot" class="${erdShotMode ? 'on' : ''}">Screenshot view</button>
          <button type="button" id="erd-arrange" class="${erdArrangeMode ? 'on' : ''}">Arrange entities</button>
          <button type="button" id="erd-reset-layout">Reset layout</button>
        </div>
        <div class="erd-legend">
          <span><i></i> Entity</span>
          <span>Crow-foot = many (*); bar = one (1)</span>
          <span>Dashed = secondary relationship</span>
          <span>Green pill = SoR (Split lists each system)</span>
          <span>${Object.keys(DATA_MODEL_2.entities).length} entities</span>
          <span id="erd-rel-count">${erdShowAllRels ? ERD_RELS.length + ' relationships (all)' : coreCount + ' of ' + ERD_RELS.length + ' relationships shown'}</span>
        </div>
      </div>
      <div class="erd-scroll">
        <div class="erd-canvas${erdArrangeMode ? ' arrange-on' : ''}" id="erd-canvas" style="width:${ERD_CANVAS.w}px;height:${ERD_CANVAS.h}px">
          <svg class="erd-edges-svg" id="erd-edges" viewBox="0 0 ${ERD_CANVAS.w} ${ERD_CANVAS.h}" width="${ERD_CANVAS.w}" height="${ERD_CANVAS.h}" aria-hidden="true">${renderErdEdgesSvg()}</svg>
          ${nodes}
        </div>
      </div>
    </div>`;
  }

  function setErdShotMode(on) {
    erdShotMode = !!on;
    document.body.classList.toggle('erd-shot', erdShotMode);
    const btn = document.getElementById('erd-shot');
    if (btn) btn.classList.toggle('on', erdShotMode);

    // Scale the canvas to the window so the whole diagram fits one capture.
    const canvas = document.getElementById('erd-canvas');
    if (!canvas) return;
    if (erdShotMode) {
      const scale = Math.min(1, (window.innerWidth - 40) / ERD_CANVAS.w);
      canvas.style.transformOrigin = 'top left';
      canvas.style.transform = `scale(${scale})`;
      canvas.style.margin = '0';
      canvas.style.marginBottom = ((scale - 1) * ERD_CANVAS.h) + 'px';
    } else {
      canvas.style.transform = '';
      canvas.style.transformOrigin = '';
      canvas.style.margin = '';
      canvas.style.marginBottom = '';
    }
  }

  function bindErdInteractions() {
    const canvas = document.getElementById('erd-canvas');
    if (!canvas) return;

    document.getElementById('erd-clear')?.addEventListener('click', () => clearSelection());
    document.getElementById('erd-shot')?.addEventListener('click', () => {
      setErdShotMode(!erdShotMode);
    });
    document.getElementById('erd-showall')?.addEventListener('click', (ev) => {
      erdShowAllRels = !erdShowAllRels;
      ev.currentTarget.classList.toggle('on', erdShowAllRels);
      redrawErdEdges();
    });
    document.getElementById('erd-labels')?.addEventListener('click', (ev) => {
      erdShowCardLabels = !erdShowCardLabels;
      ev.currentTarget.classList.toggle('on', erdShowCardLabels);
      redrawErdEdges();
    });
    document.getElementById('erd-arrange')?.addEventListener('click', () => {
      erdArrangeMode = !erdArrangeMode;
      document.getElementById('erd-arrange')?.classList.toggle('on', erdArrangeMode);
      canvas.classList.toggle('arrange-on', erdArrangeMode);
      canvas.querySelectorAll('.erd-node').forEach((n) => n.classList.toggle('arrange', erdArrangeMode));
    });
    document.getElementById('erd-reset-layout')?.addEventListener('click', () => {
      resetErdLayout();
      renderLayer();
    });

    canvas.addEventListener('click', (ev) => {
      if (ev.target === canvas || ev.target.id === 'erd-edges' || ev.target.closest('.erd-edge-g')) {
        clearSelection();
      }
    });

    let drag = null;
    canvas.querySelectorAll('.erd-node').forEach((node) => {
      node.addEventListener('click', (ev) => {
        if (node.dataset.didDrag === '1') {
          node.dataset.didDrag = '0';
          ev.preventDefault();
          return;
        }
        ev.stopPropagation();
        const erdId = node.dataset.erd;
        if (selection && selection.erdId === erdId) {
          clearSelection();
          return;
        }
        const ent = DATA_MODEL_2.entities[erdId];
        showDetail({
          type: 'erd',
          erdId,
          entityId: ent?.mapTo || node.dataset.e || erdId,
          title: ent?.name || erdId,
        });
      });

      node.addEventListener('pointerdown', (ev) => {
        if (!erdArrangeMode || ev.button !== 0) return;
        ev.preventDefault();
        const id = node.dataset.erd;
        const pos = ERD_LAYOUT[id];
        drag = {
          id,
          node,
          startX: ev.clientX,
          startY: ev.clientY,
          origX: pos.x,
          origY: pos.y,
          moved: false,
        };
        node.classList.add('dragging');
        node.setPointerCapture(ev.pointerId);
      });

      node.addEventListener('pointermove', (ev) => {
        if (!drag || drag.node !== node) return;
        const dx = ev.clientX - drag.startX;
        const dy = ev.clientY - drag.startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
        const x = Math.max(0, Math.min(ERD_CANVAS.w - ERD_BOX.w, drag.origX + dx));
        const y = Math.max(0, Math.min(ERD_CANVAS.h - ERD_BOX.h, drag.origY + dy));
        ERD_LAYOUT[drag.id] = { x, y };
        node.style.left = x + 'px';
        node.style.top = y + 'px';
        redrawErdEdges();
      });

      node.addEventListener('pointerup', (ev) => {
        if (!drag || drag.node !== node) return;
        node.classList.remove('dragging');
        try { node.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
        if (drag.moved) {
          node.dataset.didDrag = '1';
          saveErdLayout();
        }
        drag = null;
      });
    });
  }

  function renderLayer() {
    const L = LAYERS[currentLayer];
    const publicKeys = Object.keys(LAYERS).filter((k) => k !== 'migration');
    let body = '';
    if (currentLayer === 'valuechain') body = renderValueChain();
    else if (currentLayer === 'datamodel2') body = renderDataModel2();
    else if (currentLayer === 'capability') body = renderCapGroups('capability');
    else if (currentLayer === 'platform') body = renderCapGroups('platform');
    else if (currentLayer === 'datamaster') body = renderDataMaster();
    else if (currentLayer === 'migration') body = renderMigration();

    if (currentLayer !== 'datamodel2') setErdShotMode(false);

    const draftBadge = L.draft ? '<span class="draft-pill">DRAFT</span>' : '';
    const refLabel = currentLayer === 'datamodel2'
      ? 'Show reference whiteboard image'
      : currentLayer === 'capability'
        ? 'Show reference slide images (capability + asset overlays)'
        : 'Show reference slide image';
    const refAlt = currentLayer === 'datamodel2'
      ? 'Reference whiteboard: Data Model 2.0'
      : 'Reference slide';
    const refSources = Array.isArray(L.imgs) && L.imgs.length ? L.imgs : [L.img];
    const refImgsHtml = refSources.map((src, i) =>
      `<img class="ref-img" id="ref-img${i ? '-' + i : ''}" src="${esc(src)}" alt="${esc(refAlt)}${refSources.length > 1 ? ' ' + (i + 1) : ''}" />`
    ).join('\n          ');
    const crumb = currentLayer === 'migration'
      ? 'Admin layer &middot; Migration journey'
      : `Layer <strong>${publicKeys.indexOf(currentLayer) + 1}</strong> of ${publicKeys.length}`;
    main.innerHTML = `
      <div class="breadcrumb">${crumb}</div>
      <div class="layer-head"><h2>${esc(L.title)}${draftBadge}</h2>${L.desc ? `<p>${esc(L.desc)}</p>` : ''}</div>
      ${body}
      <div class="admin-footer">
        <p class="vc-ed-admin-note">Admin</p>
        <div id="admin-gate" class="admin-gate-locked">
          <button type="button" class="admin-unlock-btn" id="admin-unlock-btn">Unlock</button>
          <form id="admin-pass-form" class="admin-pass-form" hidden>
            <input type="password" id="admin-pass-input" placeholder="Password" autocomplete="current-password" />
            <button type="submit">Enter</button>
          </form>
          <p class="admin-pass-err" id="admin-pass-err" hidden>Incorrect password</p>
        </div>
        <div id="admin-tools" class="admin-tools" hidden>
          <label class="admin-muted-control"><input type="checkbox" id="show-ref" /> ${esc(refLabel)}</label>
          <button type="button" class="admin-layer-btn" id="admin-open-migration">Open Migration journey</button>
          <button type="button" class="admin-lock-btn" id="admin-lock-btn">Lock</button>
          ${refImgsHtml}
          <div id="vc-editor-slot"></div>
        </div>
      </div>
    `;
    bindAdminFooter(L);
    bindClicks();
    if (currentLayer === 'datamodel2') bindErdInteractions();
    highlightSelection();
  }

  function showDetail(payload) {
    selection = payload;
    detailEmpty.hidden = true;
    detailBody.hidden = false;
    detailPanel.classList.add('open');

    const e = payload.entityId ? ENTITIES[payload.entityId] : null;
    const erd = payload.erdId ? DATA_MODEL_2.entities[payload.erdId] : null;
    let html = `<h2>${esc(payload.title || (erd && erd.name) || (e && e.name) || 'Detail')}</h2>`;
    // Trail up top so back-links from Data Model 2.0 (and other layers) are visible without scrolling past SoR.
    html += trailHtml(payload, erd);

    if (payload.type === 'erd' && erd) {
      html += `<dl>
        <dt>Definition</dt><dd>${esc(erd.def)}</dd>
        <dt>Related entities (diagram)</dt><dd><ul class="erd-rel-list">${
          erdRelsFor(payload.erdId).map((r) => {
            const rel = DATA_MODEL_2.entities[r.other];
            return `<li><button type="button" class="entity-chip" data-erd-goto="${esc(r.other)}" style="margin:0">${esc(rel ? rel.name : r.other)}</button> <span style="color:var(--muted);font-size:11px">${esc(r.card)}</span></li>`;
          }).join('')
        }</ul></dd>
        <dt>Application / SoR link</dt><dd>${
          erd.appLink && erd.appLink.status === 'verified'
            ? `<strong>SoR: ${esc(erd.appLink.sor)}</strong>${
                Array.isArray(erd.appLink.roles) && erd.appLink.roles.length
                  ? `  -  ${esc(erd.appLink.roles.map((r) => r.sor + ' (' + r.role + ')').join(' | '))}`
                  : ''
              }${erd.appLink.note ? `  -  ${esc(erd.appLink.note)}` : ''}${
                Array.isArray(erd.appLink.roles) && erd.appLink.roles.length
                  ? `<ul class="erd-rel-list" style="margin-top:8px">${erd.appLink.roles.map((r) => `<li>${esc(r.role)} -> SoR ${esc(r.sor)}</li>`).join('')}</ul>`
                  : ''
              }${
                Array.isArray(erd.appLink.managedCopies) && erd.appLink.managedCopies.length
                  ? `<ul class="erd-rel-list" style="margin-top:8px">${erd.appLink.managedCopies.map((mc) => `<li>MC  -  ${esc(mc.subject)}: ${esc(mc.system)}</li>`).join('')}</ul>`
                  : ''
              }${
                Array.isArray(erd.appLink.consumers) && erd.appLink.consumers.length
                  ? `<ul class="erd-rel-list" style="margin-top:8px">${erd.appLink.consumers.map((c) => `<li>Consumer  -  ${esc(c.system)}${c.role ? `: ${esc(c.role)}` : ''}</li>`).join('')}</ul>`
                  : ''
              }`
            : 'SoR not set for this entity yet.'
        }</dd>
      </dl>`;
    } else if (payload.type === 'vc') {
      const st = STAGES.find(s => s.id === payload.stage);
      html += `<dl>
        <dt>Journey</dt><dd>${esc(st?.label || payload.stage)}</dd>
        <dt>Value Chain</dt><dd>${esc(st?.valueChain || st?.journey || '-')}</dd>
        <dt>Function</dt><dd>${esc(payload.functionLabel || '')}</dd>
        <dt>Capability</dt><dd>${esc(payload.capability || '')}</dd>
        <dt>Business Object</dt><dd>${esc(payload.object || '-')}</dd>
      </dl>`;
    } else if (payload.type === 'sor') {
      html += `<dl>
        <dt>Lifecycle section</dt><dd>${esc(payload.section)}</dd>
        <dt>System</dt><dd>${esc(SOR_LABELS[payload.col] || payload.col)}</dd>
        <dt>Role</dt><dd><strong>${esc(payload.sor)}</strong></dd>
      </dl>`;
    } else if (payload.type === 'mig') {
      html += `<dl>
        <dt>Migration system</dt><dd>${esc(MIG_LABELS[payload.col] || payload.col)}</dd>
        <dt>Value</dt><dd>${esc(payload.mig)}</dd>
      </dl>`;
    }

    if (e && payload.type !== 'erd') {
      const related = relatedIds(payload.entityId).filter((id) => id !== payload.entityId && ENTITIES[id]);
      html += `<dl>
        <dt>Business capability</dt><dd>${esc(e.capability)}</dd>
        <dt>Information asset</dt><dd>${esc(e.asset)}</dd>
        <dt>Platform (overlay)</dt><dd>${esc(e.platform)}</dd>
        ${related.length ? `<dt>Also highlights</dt><dd>${esc(related.map((id) => ENTITIES[id].name).join(', '))}</dd>` : ''}
      </dl>`;
    }

    detailBody.innerHTML = html;
    detailBody.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        crossJump(btn.dataset.jump, { erdId: btn.dataset.jumpErd, group: btn.dataset.jumpGroup });
      });
    });
    detailBody.querySelectorAll('[data-erd-goto]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.erdGoto;
        const node = DATA_MODEL_2.entities[id];
        if (!node) return;
        showDetail({
          type: 'erd',
          erdId: id,
          entityId: node.mapTo || id,
          title: node.name,
        });
      });
    });
    if (currentLayer === 'datamodel2') redrawErdEdges();
    else highlightSelection();
  }

  function highlightSelection() {
    document.querySelectorAll('.sel, .rel, .dim').forEach(el => {
      el.classList.remove('sel', 'rel', 'dim');
    });
    if (!selection) return;
    if (selection.erdId) {
      const erd = DATA_MODEL_2.entities[selection.erdId];
      const related = new Set([selection.erdId, ...(erd?.links || [])]);
      document.querySelectorAll('.erd-node').forEach((el) => {
        const id = el.dataset.erd;
        if (id === selection.erdId) el.classList.add('sel');
        else if (related.has(id)) el.classList.add('rel');
        else el.classList.add('dim');
      });
      document.querySelectorAll('.erd-edge-g').forEach((g) => {
        const hit = (g.dataset.a === selection.erdId && related.has(g.dataset.b))
          || (g.dataset.b === selection.erdId && related.has(g.dataset.a));
        g.querySelectorAll('.erd-edge, .erd-card-label').forEach((el) => {
          if (hit) el.classList.add('rel');
          else el.classList.add('dim');
        });
      });
      if (currentLayer === 'datamodel2') return;
    }
    if (!selection.entityId) return;

    // Value chain: highlight every cell/block that references this entity (or a related one).
    if (currentLayer === 'valuechain') {
      let any = false;
      document.querySelectorAll('.vc-cell:not(.empty)').forEach((cell) => {
        if (vcCellMatchesEntity(cell, selection.entityId)) {
          cell.classList.add('sel');
          any = true;
        } else {
          cell.classList.add('dim');
        }
      });
      document.querySelectorAll('.vc-block[data-e]').forEach((block) => {
        if (entitiesRelated(selection.entityId, block.dataset.e)) block.classList.add('sel');
      });
      if (!any) {
        // Fallback: legacy data-e exact / relatedIds match
        relatedIds(selection.entityId).forEach((id) => {
          document.querySelectorAll(`.vc-cell[data-e="${id}"]`).forEach((el) => {
            el.classList.add('sel');
            el.classList.remove('dim');
          });
        });
      }
      return;
    }

    const ids = relatedIds(selection.entityId);
    // Capability / platform / SoR / migration: bidirectional related-id match on data-e nodes.
    document.querySelectorAll('.entity-chip[data-e], .sor-cell[data-e], .entity-col[data-e]').forEach((el) => {
      if (entitiesRelated(selection.entityId, el.dataset.e)) el.classList.add('sel');
    });
    document.querySelectorAll('.cap-group').forEach((grp) => {
      const hit = [...grp.querySelectorAll('[data-e]')].some((el) => entitiesRelated(selection.entityId, el.dataset.e));
      if (hit) grp.classList.add('sel');
      else if (currentLayer === 'capability' || currentLayer === 'platform') grp.classList.add('dim');
    });
    // Keep legacy exact-id highlight for any other data-e surfaces.
    ids.forEach((id) => {
      document.querySelectorAll(`[data-e="${id}"]`).forEach((el) => el.classList.add('sel'));
    });
  }

  function bindClicks() {
    document.getElementById('vc-clear')?.addEventListener('click', () => clearSelection());
    main.querySelectorAll('.vc-cell:not(.empty)').forEach(cell => {
      cell.addEventListener('click', () => {
        const eid = cell.dataset.e;
        const row = VC_ROWS.find(r => r.id === (cell.dataset.func || cell.dataset.plat));
        const st = cell.dataset.stage;
        let stageData;
        if (row) {
          const spans = (row.spans && row.spans.length)
            ? row.spans
            : (row.spanStages ? [{ spanStages: row.spanStages, cell: row.cell }] : []);
          const hit = spans.find((sp) => (sp.spanStages || []).includes(st));
          if (hit) stageData = hit.cell;
          else {
            const rs = rowStages(row);
            stageData = rs && rs[st];
          }
        }
        const entityId = eid || (stageData && (stageData.e || (stageData.multi && stageData.multi[0].e)));
        showDetail({
          type: 'vc', entityId: entityId || null,
          title: stageData && (stageData.obj || (stageData.multi && stageData.multi.map(m => m.obj).join(', '))),
          stage: st, functionLabel: row ? row.label + (row.sub ? ' (' + row.sub + ')' : '') : '',
          capability: stageData && (stageData.cap || (stageData.multi && stageData.multi.map(m => m.cap).join(' / '))),
          object: stageData && (stageData.obj || (stageData.multi && stageData.multi.map(m => m.obj).join(', ')))
        });
      });
    });
    main.querySelectorAll('.entity-chip').forEach(chip => {
      chip.addEventListener('click', ev => {
        ev.stopPropagation();
        showDetail({ type: 'entity', entityId: chip.dataset.e, title: ENTITIES[chip.dataset.e]?.name });
      });
    });
    main.querySelectorAll('.erd-card').forEach(card => {
      card.addEventListener('click', () => {
        const erdId = card.dataset.erd;
        const node = DATA_MODEL_2.entities[erdId];
        showDetail({
          type: 'erd',
          erdId,
          entityId: node?.mapTo || card.dataset.e || erdId,
          title: node?.name || erdId,
        });
      });
    });
    // .erd-node clicks are bound in bindErdInteractions (supports toggle deselect + drag)
    main.querySelectorAll('.cap-group').forEach(grp => {
      grp.addEventListener('click', ev => {
        if (ev.target.classList.contains('entity-chip')) return;
        showDetail({ type: 'group', title: grp.querySelector('h3').textContent });
      });
    });
    main.querySelectorAll('.sor-cell').forEach(cell => {
      cell.addEventListener('click', () => {
        if (cell.dataset.mig !== undefined) {
          showDetail({ type: 'mig', entityId: cell.dataset.e, col: cell.dataset.col, mig: cell.dataset.mig, title: ENTITIES[cell.dataset.e]?.name });
        } else {
          showDetail({ type: 'sor', entityId: cell.dataset.e, col: cell.dataset.col, sor: cell.dataset.sor, section: cell.dataset.section, title: ENTITIES[cell.dataset.e]?.name });
        }
      });
    });
    main.querySelectorAll('.entity-col[data-e]').forEach(cell => {
      cell.addEventListener('click', () => showDetail({ type: 'entity', entityId: cell.dataset.e, title: ENTITIES[cell.dataset.e]?.name }));
    });
  }

  function switchLayer(id) {
    if (id === 'asset') id = 'capability';
    if (id === 'migration' && !isAdminUnlocked()) {
      // Migration is admin-only; ignore until unlocked.
      return;
    }
    currentLayer = id;
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.layer === id));
    syncAdminNavVisibility();
    renderLayer();
  }

  document.querySelectorAll('.nav button').forEach(btn => {
    btn.addEventListener('click', () => switchLayer(btn.dataset.layer));
  });

  document.getElementById('erd-shot-exit')?.addEventListener('click', () => {
    setErdShotMode(false);
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (erdShotMode) setErdShotMode(false);
      else if (selection) clearSelection();
    }
  });

  async function bootstrap() {
    function escMsg(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    if (typeof FSS_VC === 'undefined') {
      // Fallback: compile embedded JSON without vc-data.js (file:// / offline)
      const el = document.getElementById('vc-published-data');
      try {
        const data = JSON.parse(el.textContent);
        applyValueChainDocument(data);
        vcSourceLabel = 'Bundled copy in page (vc-data.js not loaded)';
      } catch (e) {
        main.innerHTML = '<p style="color:#8b1e1e;padding:24px">Could not load value chain data.</p>';
        return;
      }
    } else {
      try {
        const resolved = await FSS_VC.resolveInitialData();
        vcSourceLabel = resolved.label;
        applyValueChainDocument(resolved.data);
      } catch (e) {
        main.innerHTML = '<p style="color:#8b1e1e;padding:24px">' + escMsg(e.message) + '</p>';
        return;
      }
    }

    const urlParams = new URLSearchParams(location.search);
    if (urlParams.get('layer')) {
      let layerId = urlParams.get('layer');
      if (layerId === 'asset') layerId = 'capability';
      if (layerId === 'migration' && !isAdminUnlocked()) layerId = 'datamaster';
      if (LAYERS[layerId]) {
        currentLayer = layerId;
        document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.layer === currentLayer));
      }
    }
    syncAdminNavVisibility();
    renderLayer();
    if (urlParams.get('e') && ENTITIES[urlParams.get('e')]) {
      showDetail({ type: 'entity', entityId: urlParams.get('e'), title: ENTITIES[urlParams.get('e')].name });
    }
  }

  bootstrap();
})();
</script>
</body>
</html>
